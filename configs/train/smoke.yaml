# A future reduced-cost pipeline check, never a formal research comparison.
variant: VO
seed: 0
sensor_contract_path: configs/sensor_contract.json
graph_path: data/subgraphs/main/graph.npz
frontend_path: artifacts/frontend/frontend.npz
output: runs/smoke/VO/seed_0
model: {odor_K: [0.1, 0.3, 1.0], readout: structured, visual_bins: 5}
scenario_configs:
  normal: configs/scenarios/normal.yaml
  occlusion: configs/scenarios/occlusion.yaml
  noise: configs/scenarios/noise.yaml
  conflict: configs/scenarios/conflict.yaml
env: {episode_seconds: 2, target_motion: stationary, plume_model: gaussian, scenario: normal}
train:
  num_envs: 1
  total_steps: 128
  rollout_steps: 64
  sequence_length: 16
  sequence_batch_size: 4
  update_epochs: 1
  learning_rate: 0.0003
