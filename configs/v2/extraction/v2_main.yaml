raw_dir: data/raw
output: data/subgraphs/v2_main
min_synapses: 50
min_total_synapses: 5
downstream_hops: 2
upstream_hops: 2
convergence_hops: 3
min_neurons: 1
max_neurons: null
nt_confidence_min: 0.5
unknown_nt_policy: drop
unknown_type_policy: drop
allowed_superclasses:
- cb_intrinsic
- visual_projection
- descending_neuron
- cb_sensory
excluded_classes:
- Kenyon_Cell
excluded_type_patterns:
- APL
- DPM
selection:
  visual_seed_patterns:
  - LC9
  - LC10a
  - LC11
  - LC12
  - LC15
  - LC17
  - LPLC2
  odor_seed_patterns:
  - ORN_DM1
  - ORN_VA2
  unknown_odor_side_policy: drop
  turn_dn_patterns:
  - DNa01
  - DNa02
  - DNa03
  - DNb05
  forward_dn_patterns:
  - DNp09
  wind_seed_patterns:
  - JO-C(?:A[12]|L|M)
  - JO-E(?:D1|D2_[abc]|V[1-6])
columns:
  body: bodyId
  type: type
  side: somaSide
  root_side: rootSide
  nt_body: body
  nt_prediction: consensus_nt
  pre: body_pre
  post: body_post
  weight: weight
odor_downstream_hops: 3
require_branch_motor_paths:
- visual
- olfactory
- wind
spec_version: v2
edge_rule: type_sum
coverage_repair: true
coverage_min: 0.4
required_dn_types:
- DNa01
- DNa02
- DNa03
- DNp09
- DNb05
path_patterns:
  pn:
  - .*PN.*
  lh:
  - LH.*
type_min_synapses: 50
edge_min_synapses: 10
wind_downstream_hops: 2
required_seed_types: [LC9, LC10a, LC11, LC12, ORN_DM1, ORN_VA2]
required_seed_groups: {wind_C: "JO-C.*", wind_E: "JO-E.*"}
selection_rationale:
  branch_retry: 'One permitted branch retry: [''olfactory'']; original odor/wind hops=2/2.
    Other thresholds and upstream/visual hops unchanged.'
  selected: >-
    sweep a 是唯一通過計劃第 2 節覆蓋率、必要路徑、節點與邊預算及 no-KC 條件的一組。
    LC15、LC17、LPLC2 與個別 JO 型別依計劃書 3.4「以子圖實際納入的為準」設為可選。
    拿掉的型別列在 manifest 的 dropped_seed_types。
