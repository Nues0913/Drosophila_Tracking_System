sensor_contract_path: configs/sensor_contract.json
output: runs/evaluation/formal
scenario_configs:
  normal: configs/scenarios/normal.yaml
  occlusion: configs/scenarios/occlusion.yaml
  noise: configs/scenarios/noise.yaml
  conflict: configs/scenarios/conflict.yaml
env:
  episode_seconds: 60
  # Per-episode layout diversity (flytrack_core.world.layout defaults): random
  # circling direction, radius 1.5-3.5 m, start offsets +/-0.5 m and +/-30 deg.
  # A fixed CCW circle let a blind constant left turn match the teacher.
  target_motion: curved
  plume_model: puff
  domain_randomization: false
evaluation:
  variants: [V, O, VO, VO-late, GRU, RS]
  scenarios: [normal, occlusion, noise, conflict]
  seeds: [0, 1, 2, 3, 4]
  episodes_per_seed: 100
  # Episodes run batched across parallel worlds; the first latency_episodes of
  # each cell run one actor call per step to measure deployment latency.
  batch_episodes: 32
  latency_episodes: 1
  # #35 Decision 6382764327: the formal actor is the BC/DAgger artifact.
  artifact_template: 'runs/bc/{variant}/seed_{seed}/actor'
  require_full_matrix: true
  require_equal_budget: true
  # Held-out environment seeds, disjoint from the training namespace [0, 1e9).
  environment_seed: 1700000000
  bootstrap_draws: 10000
  # Bitwise-reproducible GPU runs (deterministic kernels, no cuSPARSE), about 2x
  # slower. Use it for regression checks against reference files made the same way.
  deterministic: false
  success_distance_m: 2.0
  success_time_fraction: 0.8
  # A tracked sample must also face the target (protocol amendment 2026-10-17).
  success_bearing_deg: 45.0
  # Blind constant actions are run on the same world first; evaluation refuses
  # a world in which any of them succeeds in more than 10% of episodes.
  environment_audit_episodes: 40
