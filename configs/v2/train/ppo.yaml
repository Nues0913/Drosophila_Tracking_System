# PPO-v2 (plan 3.8 Stage 2, #138), from a Stage 1 artifact (--init). Pilots only until M4.
envs_per_instance: 256  # 4 world instances (v1compat, wind x curved, wander): 1,024 environments
episode_seconds: 60
wind_speed_m_s: 0.5
plume_model: puff
scenarios: {normal: 0.40, occlusion: 0.25, noise: 0.20, conflict: 0.15}
desync_first_episode: true
held_out: {fraction: 0.0}  # unused by PPO (WP4a's collector keeps one row aside)
total_env_steps: 10000000
rollout_steps: 32
epochs: 4
minibatches: 8
gamma: 0.99
gae_lambda: 0.95
clip: 0.2
target_kl: 0.02  # an epoch loop stops early above 1.5 x target
kl_stop: {factor: 4.0, patience: 3}  # engineering failure: approx KL above 4 x target 3 times
value_coef: 0.5
entropy_coef: 0.001
activity_coef: 1.0e-4  # as in Stage 1: non-readout neurons (graph variants), the hidden state (GRU2)
grad_clip: 0.5
actor_lr: 3.0e-4
critic_lr: 3.0e-4
critic_hidden: [256, 256]
warmup: {critic_only_updates: 20, actor_ramp_updates: 20}  # plan 3.8, #161 D2 (pilots)
kickstart: {initial_lambda: 1.0, anneal_fraction: 0.3}
# #138 A2 third version: a Huber loss on the occlusion teacher's m/s on occluded steps (ppo.py);
# coef 0 leaves it off and runs no teacher
occlusion_speed: {coef: 0.0, scale_m_s: 0.05, strong_slowdown: 0.1, limit_acceleration: false}
# #138 A2 fourth version: the same teacher's turn rate on the same steps and groups
occlusion_turn: {coef: 0.0, scale_rad_s: 0.5}
checkpoint_every: 25
