# #35 S5 exploration evaluation (frozen core, refitted DN-population speed readout; VO-late only):
# explore/s4/configs/eval_s4.yaml with the S6 block environment_seed 1,980,000,000 (the baseline evaluation
# of that block is shared with S6) and the S5 actors.
env:
  domain_randomization: false
  episode_seconds: 60
  plume_model: puff
  target_motion: curved
evaluation:
  artifact_template: runs/s5/{variant}/seed_{seed}/actor
  batch_episodes: 32
  bootstrap_draws: 10000
  deterministic: false
  environment_audit_episodes: 40
  environment_seed: 1980000000
  episodes_per_seed: 100
  latency_episodes: 1
  require_equal_budget: true
  require_full_matrix: false
  scenarios:
  - normal
  - occlusion
  - noise
  - conflict
  seeds:
  - 0
  - 1
  success_bearing_deg: 45.0
  success_distance_m: 2.0
  success_time_fraction: 0.8
  variants:
  - VO-late
output: runs/s5/eval/candidate_s5
scenario_configs:
  conflict: configs/scenarios/conflict.yaml
  noise: configs/scenarios/noise.yaml
  normal: configs/scenarios/normal.yaml
  occlusion: configs/scenarios/occlusion.yaml
sensor_contract_path: configs/sensor_contract.json
