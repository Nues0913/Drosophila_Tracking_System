- ros_topic_name: /clock
  gz_topic_name: /world/tracking/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK
- ros_topic_name: /cmd_vel
  gz_topic_name: /model/agent/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
  subscriber_queue: 1
  publisher_queue: 1
- ros_topic_name: /sim/camera/left/image_raw
  gz_topic_name: /model/agent/camera/left/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /sim/camera/right/image_raw
  gz_topic_name: /model/agent/camera/right/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /world/agent/pose
  gz_topic_name: /model/agent/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS
- ros_topic_name: /sim/camera/left/source_timing
  gz_topic_name: /model/agent/camera/left/image/source_timing
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /sim/camera/right/source_timing
  gz_topic_name: /model/agent/camera/right/image/source_timing
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- ros_topic_name: /world/target/pose
  gz_topic_name: /model/target/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS
