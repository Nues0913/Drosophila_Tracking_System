reference: VO
tolerance: 0.05
variants: [V, O, VO, VO-late, GRU, RS]
common:
  alpha_init: 0.01
  init_spectral_radius: 0.9
  tau_init: 0.05
  bias_init: 0.0
  motor_rate_beta: 10.0
  # Edges into the six motor DNs keep a fixed x100 conductance gain; the global
  # spectral cap is computed with it (it does not change the radius on the real graph).
  motor_input_gain: 100.0
  # ORN input drive (#4, G2 Decision): x100 keeps odor's effect alive through pretrain
  # with frozen pretrain biases and the population-RMS decoder (seeds 0 and 1). A
  # constant input scale, not a parameter. All six share the encoder; GRU alone
  # compensates this gain before its dense input bottleneck (#85).
  odor_input_gain: 100.0
  # Offset for the DN left/right structural asymmetry (not a behavioural turn bias).
  readout_turn_bias: true
  # Graphs at or above this node count use the sparse core. 4000 keeps the #55 no-KC
  # graph (4,502 nodes) sparse: dense was ~2.5x slower on CUDA (RTX 2060 probe) and ~20x
  # on one CPU thread, with matching outputs. main (2,569) stays dense, olfactory_v2 sparse.
  # Must equal the policy.py default, which direct training runs use (#59 review).
  dense_threshold: 4000
  readout: structured
  odor_K: [0.1, 0.3, 1.0]
  odor_hill_n: 2.0
  odor_adaptation_tau_s: 2.0
  # #4 P2 (formal spec since 2026-10-24): one ORN adaptation state for both sides
  # keeps the L/R contrast; per-side adaptation erased most of it.
  odor_shared_adaptation: true
  visual_bins: 5
  allow_unknown_side_mean: false
  visual_input_mapping: {}
  log_std_init: -0.5
overrides:
  RS: {random_seed: 0, random_swaps_per_edge: 10}
  GRU: {hidden_size: 16, gru_odor_gain_compensation: true}
# #4 B3 (formal spec since 2026-10-24): DNb05 L/R turn rows, calibrated by BC on its
# round-0 teacher episodes (train.calibrate_extra_turn). Left out: V, where DNb05 stays
# silent without odor input (L + R < 1e-5 on teacher episodes); RS, whose rewired right
# DNb05 gets no input (L/R ratio fixed at 1, no calibratable signal); GRU, no DN readout.
extra_turn_rows: {types: [DNb05], eps: 0.1, variants: [O, VO, VO-late]}
