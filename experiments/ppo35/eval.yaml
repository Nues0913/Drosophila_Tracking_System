variant: V
seed: 0
sensor_contract_path: configs/sensor_contract.json
graph_path: data/subgraphs/main/graph.npz
frontend_path: artifacts/frontend/frontend.npz
init_artifact: runs/t3/pretrain_vision/actor
output: runs/t3/bc
model:
  odor_K:
  - 0.1
  - 0.3
  - 1.0
  readout: structured
  visual_bins: 5
scenario_configs:
  normal: configs/scenarios/normal.yaml
  occlusion: configs/scenarios/occlusion.yaml
  noise: configs/scenarios/noise.yaml
  conflict: configs/scenarios/conflict.yaml
env:
  episode_seconds: 60
  scenario: normal
  target_motion:
  - curved
  - wander
  plume_model: puff
train:
  teacher_steps: 60000
  dagger_steps_per_round: 30000
  dagger_rounds: 3
  dagger_beta: 0.5
  epochs: 30
  batch_episodes: 16
  validation_every: 10
  early_stopping_patience: 3
  sequence_length: 32
  learning_rate: 0.001
  core_bias_learning_rate: 0.0
  readout_learning_rate: 0.01
  early_stopping_min_delta: 0.005
  max_grad_norm: 0.5
  activity_coef: 0.0001
