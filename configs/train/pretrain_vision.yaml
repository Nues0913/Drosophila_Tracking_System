variant: VO
seed: 0
sensor_contract_path: configs/sensor_contract.json
graph_path: data/subgraphs/main/graph.npz
frontend_path: artifacts/frontend/frontend.npz
output: runs/pretrain/VO/seed_0/vision
model: {odor_K: [0.1, 0.3, 1.0], readout: structured, visual_bins: 5}
scenario_configs:
  normal: configs/scenarios/normal.yaml
  occlusion: configs/scenarios/occlusion.yaml
  noise: configs/scenarios/noise.yaml
  conflict: configs/scenarios/conflict.yaml
env:
  episode_seconds: 60
  scenario: normal
  # Per-episode layout diversity (flytrack_core.world.layout defaults): random
  # circling direction, radius 1.5-3.5 m, start offsets +/-0.5 m and +/-30 deg.
  # A fixed CCW circle let a blind constant left turn match the teacher.
  # Linear targets reverse into the follower at walls (teacher collides 13%);
  # they stay in the PPO warm-up curriculum only.
  target_motion: [curved, wander]
  plume_model: gaussian
train:
  modality: vision
  total_steps: 120000
  # #4 G2 Decision: frozen neuron-type biases keep the DN working point (vision
  # pretraining otherwise silenced DNa01 and the odor path); PPO/ES keep them trainable.
  core_bias_learning_rate: 0.0
  # Population-RMS decoder inputs keep odor pretraining stable at odor_input_gain 100.
  decoder_input_scale: population_rms
  # Upper bound only: held-out early stopping decides (V seed 0 vision stopped at 11).
  epochs: 40
  batch_episodes: 16
  validation_every: 10
  early_stopping_patience: 3
  sequence_length: 32
  learning_rate: 0.001
  max_grad_norm: 0.5
  exploration_probability: 0.2
  angular_velocity_coef: 0.1
  activity_coef: 0.0001
