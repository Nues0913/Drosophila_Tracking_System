variant: VO
seed: 0
sensor_contract_path: configs/sensor_contract.json
# Formal graph since 2026-10-24 (#55): the no-KC olfactory candidate.
graph_path: data/subgraphs/olfactory_v2_nokc/graph.npz
frontend_path: artifacts/frontend/frontend.npz
init_artifact: runs/pretrain/VO/seed_0/odor/actor
output: runs/bc/VO/seed_0
model: {odor_K: [0.1, 0.3, 1.0], readout: structured, visual_bins: 5}
scenario_configs:
  normal: configs/scenarios/normal.yaml
  occlusion: configs/scenarios/occlusion.yaml
  noise: configs/scenarios/noise.yaml
  conflict: configs/scenarios/conflict.yaml
env:
  episode_seconds: 60
  scenario: normal
  # Per-episode layout diversity (flytrack_core.world.layout defaults): random
  # circling direction, radius 1.5-3.5 m, start offsets +/-0.5 m and +/-30 deg.
  # A fixed CCW circle let a blind constant left turn match the teacher.
  # Linear targets reverse into the follower at walls (teacher collides 13%);
  # they stay in the PPO warm-up curriculum only.
  target_motion: [curved, wander]
  plume_model: puff
train:
  teacher_steps: 60000
  dagger_steps_per_round: 30000
  dagger_rounds: 3
  dagger_beta: 0.5
  # Upper bound only: held-out early stopping decides each round.
  epochs: 30
  batch_episodes: 16
  validation_every: 10
  early_stopping_patience: 3
  sequence_length: 32
  learning_rate: 0.001
  # Offline BC: neuron-type bias gradients are 30-1000x the conductance gradients
  # and erased the bearing information reaching the DNs; freeze them in BC and let
  # the motor readout learn faster (docs/dn/scenario_test_2026-10-17.md).
  core_bias_learning_rate: 0.0
  readout_learning_rate: 0.01
  # Relative improvement required to keep training; 0 never stopped a flat round.
  early_stopping_min_delta: 0.005
  max_grad_norm: 0.5
  activity_coef: 0.0001
  # #4 B3 (formal spec since 2026-10-24): DNb05 L/R turn rows, calibrated on the
  # round-0 teacher episodes before the first fit. prepare_experiments.py keeps this
  # only for the variants in configs/model/variants.yaml extra_turn_rows.
  calibrate_extra_turn: {types: [DNb05], eps: 0.1}
