env:
  episode_seconds: 60
  plume_model: puff
  randomize_target_direction: true
  # Pin the 2026-10-17 scenario-test world under the newer defaults
  # (no radius/start randomization, distance-only success).
  randomize_target_layout: false
  success_bearing_deg: null
  scenario: normal
  start_heading_offset_deg: 30
  start_lateral_offset_m: 0.5
  target_motion: curved
frontend_path: artifacts/frontend/frontend.npz
graph_path: data/subgraphs/main/graph.npz
init_artifact: <runs>/dn_gain_test/pretrain/odor/actor
model:
  allow_unknown_side_mean: false
  alpha_init: 0.01
  bias_init: 0.0
  budget_target: 6794
  dense_threshold: 5000
  gru_input_size: null
  hidden_size: 16
  init_spectral_radius: 0.9
  log_std_init: -0.5
  motor_rate_beta: 10.0
  odor_K:
  - 0.1
  - 0.3
  - 1.0
  odor_adaptation_tau_s: 2.0
  odor_hill_n: 2.0
  odor_seed_types: null
  random_seed: 0
  random_swaps_per_edge: 10
  readout: structured
  tau_init: 0.05
  visual_bins: 5
  visual_input_mapping: {}
  visual_seed_types: null
output: <runs>/scenario_test/bc_A
scenario_configs:
  conflict: configs/scenarios/conflict.yaml
  noise: configs/scenarios/noise.yaml
  normal: configs/scenarios/normal.yaml
  occlusion: configs/scenarios/occlusion.yaml
seed: 0
sensor_contract_path: configs/sensor_contract.json
train:
  activity_coef: 0.0001
  batch_episodes: 16
  dagger_beta: 0.5
  dagger_rounds: 2
  dagger_steps_per_round: 15000
  early_stopping_min_delta: 0.005
  early_stopping_patience: 3
  epochs: 30
  learning_rate: 0.001
  max_grad_norm: 0.5
  sequence_length: 32
  teacher_steps: 30000
  validation_every: 10
variant: VO
