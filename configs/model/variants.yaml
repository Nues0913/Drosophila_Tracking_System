reference: VO
tolerance: 0.05
variants: [V, O, VO, VO-late, GRU, RS]
common:
  alpha_init: 0.01
  init_spectral_radius: 0.9
  tau_init: 0.05
  bias_init: 0.0
  motor_rate_beta: 10.0
  # Edges into the six motor DNs keep a fixed x100 conductance gain; the global
  # spectral cap is computed with it (it does not change the radius on the real graph).
  motor_input_gain: 100.0
  # ORN input drive (#4, G2 Decision): x100 keeps odor's effect alive through pretrain
  # with frozen pretrain biases and the population-RMS decoder (seeds 0 and 1). A
  # constant input scale, not a parameter; GRU shares the encoder, so all six match.
  odor_input_gain: 100.0
  # Offset for the DN left/right structural asymmetry (not a behavioural turn bias).
  readout_turn_bias: true
  # Graphs at or above this node count use the sparse core. 4000 keeps the #55 no-KC
  # graph (4,502 nodes) sparse: dense was ~2x slower on CUDA (RTX 2060 probe) and ~20x
  # on one CPU thread, with matching outputs. main (2,569) stays dense, olfactory_v2 sparse.
  dense_threshold: 4000
  readout: structured
  odor_K: [0.1, 0.3, 1.0]
  odor_hill_n: 2.0
  odor_adaptation_tau_s: 2.0
  visual_bins: 5
  allow_unknown_side_mean: false
  visual_input_mapping: {}
  log_std_init: -0.5
overrides:
  RS: {random_seed: 0, random_swaps_per_edge: 10}
  GRU: {hidden_size: 16}
