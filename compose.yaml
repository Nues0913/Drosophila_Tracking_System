name: flytrack
x-ml: &ml
  image: flytrack-ml:0.1
  build:
    context: .
    dockerfile: docker/ml.Dockerfile
    args:
      ML_REQUIREMENTS: ${ML_REQUIREMENTS:-requirements/ml-cu126-py312.lock}
  working_dir: /workspace
  volumes:
    - ./data:/workspace/data
    - ./runs:/workspace/runs
    - ./artifacts:/workspace/artifacts
    - ./configs:/workspace/configs:ro
x-ros: &ros
  image: flytrack-ros:0.1
  build:
    context: .
    dockerfile: docker/ros.Dockerfile
    args:
      TORCH_INDEX_URL: ${ROS_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
  network_mode: host
  ipc: host
  stop_signal: SIGINT
  working_dir: /workspace
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    GZ_PARTITION: ${COMPOSE_PROJECT_NAME:-flytrack}
    GZ_IP: ${GZ_IP:-127.0.0.1}
    NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
  volumes:
    - ./artifacts:/workspace/artifacts:ro
    - ./configs:/workspace/configs:ro
    - ./runs:/workspace/runs
services:
  extract:
    <<: *ml
    profiles: [ml]
    environment:
      NEUPRINT_TOKEN: ${NEUPRINT_TOKEN:-}
    command: [python, -m, connectome_extract, extract, --config, configs/extraction/main.yaml]
  train:
    <<: *ml
    profiles: [ml]
    gpus: all
    # Formal chain ends at BC (#35 option D); needs the pretrain actor in bc.yaml.
    command: [python, -m, flytrack_train, bc, --config, configs/train/bc.yaml]
  sim:
    <<: *ros
    profiles: [sim]
    gpus: all
    command: [ros2, launch, flytrack_bringup, world.launch.py, "scenario:=${SCENARIO:-normal}", "target_motion:=${TARGET_MOTION:-curved}", "seed:=${ENVIRONMENT_SEED:-731}", "training_seed:=${TRAINING_SEED:-0}", "max_episodes:=${MAX_EPISODES:-0}"]
    healthcheck:
      test: [CMD, bash, /flytrack-entrypoint.sh, python, /workspace/scripts/check_ros_clock.py]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  policy:
    <<: *ros
    profiles: [sim]
    # Replaces the anchor's environment (YAML merge is shallow): keep the four keys in step.
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      GZ_PARTITION: ${COMPOSE_PROJECT_NAME:-flytrack}
      GZ_IP: ${GZ_IP:-127.0.0.1}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
      # Torch intra-op threads. The default (all cores) competes with Gazebo's software
      # renderer and dropped the formal actors to 3-11 Hz on an 8-thread host (#88 G1).
      OMP_NUM_THREADS: ${POLICY_TORCH_THREADS:-1}
      MKL_NUM_THREADS: ${POLICY_TORCH_THREADS:-1}
    depends_on:
      sim: {condition: service_healthy}
    command: [ros2, run, flytrack_policy, connectome_policy_node, --ros-args, -p, "use_sim_time:=true", -p, "artifact:=${ARTIFACT:-/workspace/artifacts/VO}", -p, "sensor_contract_json:=/workspace/configs/sensor_contract.json", -p, "device:=${POLICY_DEVICE:-cpu}", -p, "vision_kernel:=${POLICY_VISION_KERNEL:-subrays}"]
  eval:
    <<: *ros
    profiles: [sim]
    depends_on:
      sim: {condition: service_healthy}
    command: [ros2, run, flytrack_eval, evaluator_node, --ros-args, -p, "use_sim_time:=true", -p, "artifact:=${ARTIFACT:-/workspace/artifacts/VO}", -p, "training_seed:=${TRAINING_SEED:-0}", -p, "output_dir:=${EVAL_OUTPUT:-/workspace/runs/gazebo_eval/demo}"]
  viz:
    <<: *ros
    profiles: [sim]
    depends_on:
      sim: {condition: service_healthy}
    command: [ros2, launch, foxglove_bridge, foxglove_bridge_launch.xml, port:=8765]
