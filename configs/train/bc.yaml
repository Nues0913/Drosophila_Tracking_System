variant: VO
seed: 0
sensor_contract_path: configs/sensor_contract.json
graph_path: data/subgraphs/main/graph.npz
frontend_path: artifacts/frontend/frontend.npz
init_artifact: runs/pretrain/VO/seed_0/odor/actor
output: runs/bc/VO/seed_0
model: {odor_K: [0.1, 0.3, 1.0], readout: structured, visual_bins: 5}
env:
  episode_seconds: 60
  scenario: normal
  target_motion: curved
  plume_model: puff
train:
  teacher_steps: 60000
  dagger_steps_per_round: 30000
  dagger_rounds: 3
  dagger_beta: 0.5
  epochs: 10
  sequence_length: 32
  learning_rate: 0.001
  max_grad_norm: 0.5
  activity_coef: 0.0001
